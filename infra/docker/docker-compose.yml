# Local development dependencies for EPL Move.
# Prod uses Cloud SQL / Memorystore / Pub/Sub; this gives the same surface locally.
#   pnpm infra:up   (start)   |   pnpm infra:down   (stop)
name: epl-move-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: epl-postgres
    environment:
      POSTGRES_USER: epl
      POSTGRES_PASSWORD: epl
      POSTGRES_DB: epl_move
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epl -d epl_move"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: epl-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Google Pub/Sub emulator. Host port 8681 deliberately avoids quote-svc :8085.
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: epl-pubsub
    command: >
      gcloud beta emulators pubsub start
      --project=epl-move-local
      --host-port=0.0.0.0:8681
    ports:
      - "8681:8681"

volumes:
  pgdata:
  redisdata:
